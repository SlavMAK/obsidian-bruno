<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruno</title>
  <style>
    html, body, #root {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    body {
      background-color: var(--vscode-editor-background);
      color: var(--vscode-editor-foreground);
      font-family: var(--vscode-font-family);
    }
  </style>
  <script>
    // Buffer host events that arrive before the React bundle registers its
    // listener; utils/ipc.ts drains this on startup.
    window.__brunoMessageBuffer = [];
    window.addEventListener('message', function (event) {
      try {
        var buf = window.__brunoMessageBuffer;
        if (buf) { buf.push(event.data); }
      } catch (e) { /* document is being torn down */ }
    });
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
